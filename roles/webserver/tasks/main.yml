---
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install Apache HTTP Server
  ansible.builtin.apt:
    name: apache2
    state: present

- name: Deploy website homepage
  ansible.builtin.copy:
    dest: /var/www/html/index.html
    content: |
      <!DOCTYPE html>
      <html>
      <head>
        <title>Ansible Deployment</title>
      </head>
      <body>
        <h1>Deployment Successful!</h1>
        <p>Configured automatically using Ansible.</p>
      </body>
      </html>
    owner: root
    group: root
    mode: "0644"

- name: Ensure Apache is running and enabled
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true
